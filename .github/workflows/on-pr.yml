name: checks

on:
  pull_request:
    branches: ["main"]
  push: # DEBUG

jobs:

  build:
    runs-on: ubuntu-24.04
    env:
      STACK_LTS: lts-23.27

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Stack
        uses: haskell-actions/setup@v2.8.2
        with:
          enable-stack: true
          stack-no-global: true

      - name: Setup Cache
        uses: ./.github/actions/stack-cache
        with:
          snapshot: lts-23.27

      - name: Build
        run: |
          stack build
